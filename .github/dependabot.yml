version: 2
updates:
  # The root requirements.txt is a uv lock generated from requirements.in (see
  # its header), like the face service one, so it uses the uv ecosystem too. If a
  # Dependabot PR does not regenerate it with the header command (which includes
  # the face service lock as a constraint), audit.yml fails the PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # The face service has its own dependency set: Pillow, OpenCV and ONNX
  # Runtime are the parsers that handle untrusted image bytes, so they need
  # their own update stream. requirements.txt is a uv lock, not a pip-compile
  # lock, so this must use the uv ecosystem: it reads requirements.in as the
  # manifest and regenerates requirements.txt with uv. One grouped PR per week
  # keeps the lock moving as a unit that CI can test end to end.
  - package-ecosystem: "uv"
    directory: "/model-server"
    schedule:
      interval: "weekly"
    groups:
      face-service:
        patterns:
          - "*"
    ignore:
      # kserve 0.21.0 requires protobuf>=6.33.5,<7.0.0, so any update to a 7.x
      # release is unsatisfiable and shows up as unknown_error in the weekly
      # run. protobuf is no longer a direct requirement in requirements.in
      # (that exact pin was what Dependabot rewrote to 7.36.2), so this rule is
      # the second layer for the transitive pin. 6.33.x updates still flow;
      # remove this rule once a kserve release allows protobuf 7.
      - dependency-name: "protobuf"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
