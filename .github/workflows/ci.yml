name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned deliberately: an unpinned Ruff could add rules or change
      # formatting and turn this job red on unchanged code. Bump together
      # with the local version used for `ruff format .`.
      - name: Install Ruff
        run: pip install "ruff==0.17.2"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Pinned like Ruff. Installs the runtime requirements so mypy sees the real
      # redis/cryptography types; the stub packages cover requests and PyMySQL.
      # Scope (the small modules first) lives in [tool.mypy] in pyproject.toml.
      - name: Type check (mypy)
        run: |
          pip install -r requirements.txt "mypy==2.4.0" types-requests types-PyMySQL
          mypy

      # The Toolforge build service does a plain clone. The ONNX weights must be
      # ordinary git blobs: a Git LFS pointer file or a submodule would build
      # "successfully" and then fail at runtime. See scripts/check_no_lfs.sh.
      - name: Weights are plain git blobs (no LFS, no submodules, no pointer files)
        run: scripts/check_no_lfs.sh

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15.1 is the latest stable patch and an expedited security release
        # (2026-10-21); bump this pin when a newer 3.15.x lands.
        python-version: ["3.12", "3.15.1"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --tb=short -q

  # The race-condition fixes (SDC writes, inference persistence, project claims,
  # migrations) are guarded by tests that need a real MariaDB, so they must run
  # here and not only on a developer's machine. The image matches local
  # development (docker run mariadb:10.11); the test suite creates and drops its
  # own wikiface_test database.
  integration:
    name: Integration tests (MariaDB) + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: devpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # fail_under in [tool.coverage.report] gates the whole project; the next
      # step gates each module.
      - name: Run unit + integration tests with coverage
        env:
          WIKIVISAGE_TEST_DB: "1"
        run: pytest --tb=short -q --cov --cov-report=term --cov-report=json:coverage.json

      - name: Coverage floors per module
        run: python scripts/check_coverage_floors.py coverage.json

  browser:
    name: Bbox editor (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-browser.txt

      - name: Install browser test dependencies
        run: pip install -r requirements-browser.txt

      - name: Install Chromium and WebKit
        run: python -m playwright install --with-deps chromium webkit

      - name: Run browser regressions
        env:
          WIKIVISAGE_BROWSER_TESTS: "1"
        run: pytest tests/test_bbox_editor_browser.py -v --tb=short

  face-service-unit:
    name: Face service (backend + model unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Verify model weights (SHA256SUMS)
        working-directory: model-server/weights
        run: sha256sum -c SHA256SUMS

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            model-server/requirements.txt
            requirements-dev.txt

      # The only job that installs the ONNX/OpenCV/KServe stack outside a
      # container; the plain test job skips these files (importorskip).
      - name: Install face service and test dependencies
        run: pip install -r model-server/requirements.txt -r requirements-dev.txt

      - name: Run backend and model unit tests
        env:
          WIKIVISAGE_REQUIRE_SAMPLE: "1"
        run: pytest tests/test_face_service_backend.py tests/test_face_service_model.py -v --tb=short

  face-service:
    name: Face service (build + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A Git LFS pointer file or a truncated weight file fails here, before
      # any image is built. model.py repeats the check at startup.
      - name: Verify model weights (SHA256SUMS)
        working-directory: model-server/weights
        run: sha256sum -c SHA256SUMS

      - uses: docker/setup-buildx-action@v4

      # Builds model-server/ and runs face_client.py against the real container;
      # this is the only job that crosses the HTTP boundary for real, so it
      # catches a broken Dockerfile, an unresolvable dependency, or wire-format
      # drift between the client and the server.
      - name: Build face service image
        uses: docker/build-push-action@v7
        with:
          context: ./model-server
          load: true
          tags: wikivisage-face-service:ci
          cache-from: type=gha,scope=face-service
          cache-to: type=gha,mode=max,scope=face-service

      # Run with a token, as production does, so the request guard is exercised
      # and the auth contract tests stay enabled.
      - name: Start face service
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "WIKIVISAGE_FACE_SERVICE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker run -d --name face-service \
            -p 8080:8080 \
            -e WIKIVISAGE_FACE_WORKERS=2 \
            -e WIKIVISAGE_FACE_SERVICE_TOKEN="$TOKEN" \
            --memory=3g --cpus=2 \
            wikivisage-face-service:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v1/models/wikivisage 2>/dev/null | grep -q '"ready":true'; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::face service did not become ready within 60s"
          docker logs face-service
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install client dependencies
        run: pip install -r requirements-dev.txt

      - name: Run contract tests
        env:
          WIKIVISAGE_FACE_SERVICE_CONTRACT: "1"
          WIKIVISAGE_FACE_SERVICE_URL: http://localhost:8080
          WIKIVISAGE_REQUIRE_SAMPLE: "1"
        run: pytest tests/test_face_service_contract.py -v --tb=short

      # The detector's declared output shapes come from a 640x640 trace, so ORT
      # logs VerifyOutputSizes on every other input size unless the session's
      # log level is raised (backend._make_session). The contract tests have
      # just sent many differently sized images.
      - name: No ONNX Runtime VerifyOutputSizes warnings in the service log
        run: |
          if docker logs face-service 2>&1 | grep -q VerifyOutputSizes; then
            echo "::error::service log contains VerifyOutputSizes warnings"
            docker logs face-service 2>&1 | grep VerifyOutputSizes | head -5
            exit 1
          fi

      - name: Face service logs
        if: failure()
        run: docker logs face-service

  face-service-buildpack:
    name: Face service (Toolforge buildpack + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify model weights (SHA256SUMS)
        working-directory: model-server/weights
        run: sha256sum -c SHA256SUMS

      # Production does not use the Dockerfile: Toolforge builds model-server/
      # with Cloud Native Buildpacks. This builds it the same way, with
      # Toolforge's builder, so a requirements.txt / Procfile change that only
      # breaks the buildpack path fails here, not in a release. The face service
      # needs no system packages (no project.toml), so heroku/deb-packages is
      # not requested; only the Python and Procfile buildpacks run.
      - name: Build with Toolforge's builder
        run: |
          docker run --rm -u root \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/model-server":/workspace -w /workspace \
            buildpacksio/pack:0.40.10 build wikivisage-face-bp:ci \
            --builder tools-harbor.wmcloud.org/toolforge/heroku-builder:24_20261023 \
            --buildpack heroku/python --buildpack heroku/procfile

      # Same entrypoint, port and fail-closed check as the Toolforge job:
      # TOOL_TOOLFORGE_API_URL makes model.py refuse to start without a token.
      - name: Start face service
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "WIKIVISAGE_FACE_SERVICE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker run -d --name face-service -p 8000:8000 --entrypoint web \
            -e TOOL_TOOLFORGE_API_URL=https://example.invalid \
            -e WIKIVISAGE_FACE_SERVICE_TOKEN="$TOKEN" \
            --memory=3g --cpus=2 \
            wikivisage-face-bp:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/v1/models/wikivisage 2>/dev/null | grep -q '"ready":true'; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::face service did not become ready within 90s"
          docker logs face-service
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install client dependencies
        run: pip install -r requirements-dev.txt

      - name: Run contract tests
        env:
          WIKIVISAGE_FACE_SERVICE_CONTRACT: "1"
          WIKIVISAGE_FACE_SERVICE_URL: http://localhost:8000
          WIKIVISAGE_REQUIRE_SAMPLE: "1"
        run: pytest tests/test_face_service_contract.py -v --tb=short

      - name: No ONNX Runtime VerifyOutputSizes warnings in the service log
        run: |
          if docker logs face-service 2>&1 | grep -q VerifyOutputSizes; then
            echo "::error::service log contains VerifyOutputSizes warnings"
            docker logs face-service 2>&1 | grep VerifyOutputSizes | head -5
            exit 1
          fi

      - name: Face service logs
        if: failure()
        run: docker logs face-service
