name: Release

# Release flow: the version in pyproject.toml is the marker, and a merge is the
# only manual step.
#
#   push to main      -> if the pyproject.toml version has no `v<version>` tag
#                        yet: create the tag, publish the release (notes
#                        generated from the merged PRs, the same body the manual
#                        "Draft a new release" produced) and dispatch the deploy.
#                        Ordinary pushes (fixes, Dependabot, a batch of features
#                        before you are ready) release nothing.
#   Run workflow      -> opens a `chore: release vX.Y.Z` pull request that bumps
#                        the version (patch/minor/major). Merge it when the batch
#                        is ready and the push path above takes over.
#
# The deploy is dispatched explicitly. GitHub suppresses workflow runs for
# events caused by the built-in GITHUB_TOKEN — `release: published` included —
# so a release created here would never start deploy.yml on its own.
# `workflow_dispatch` is the documented exception, hence `gh workflow run`.
# deploy.yml keeps its `release: published` trigger, so publishing a release by
# hand still deploys, and a failed deploy can be re-run there.
#
# Opening the release pull request needs the repository setting
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests". Without it the branch is still pushed and the run summary
# links to the "open a pull request" page.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version the release pull request should bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the tag and the release branch, create the release
  pull-requests: write # open the release pull request
  actions: write # read the CI run for this commit, dispatch deploy.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      BUMP: ${{ inputs.bump || 'patch' }}
    steps:
      # A manual run can be started from any branch. Releasing a branch commit
      # would tag it and deploy it to production, so only main is accepted.
      - name: Only main can be released
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release runs on main only (this run is on ${GITHUB_REF}). Pick 'main' in 'Use workflow from'."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the version on main
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          # Strictly X.Y.Z: a pre-release or suffixed version would be published
          # and deployed to production like any other.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pyproject.toml version '$VERSION' is not X.Y.Z; refusing to release or bump it."
            exit 1
          fi
          echo "main-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "main: $VERSION"

      # One decision, three outcomes:
      #   release     the version is ready and un-tagged -> tag, publish, deploy
      #   release-pr  a dispatch that should prepare the next version
      #   none        an ordinary push: nothing to do
      # The tag is the ledger, so every path here is idempotent.
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          MAIN_VERSION="${{ steps.version.outputs.main-version }}"
          TAG="v${MAIN_VERSION}"

          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1; }
          emit() {
            {
              echo "mode=$1"
              echo "version=$2"
              echo "tag=v$2"
            } >> "$GITHUB_OUTPUT"
          }

          # A version on main without a tag means a release is pending (or a
          # previous attempt failed before the tag existed): finish that one
          # rather than proposing a different number.
          if ! tag_exists "$TAG"; then
            echo "main carries ${MAIN_VERSION} and ${TAG} does not exist yet."
            emit release "$MAIN_VERSION"
            exit 0
          fi

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "${TAG} is already released; this push carries no new version."
            emit none "$MAIN_VERSION"
            exit 0
          fi

          # Bump the highest version tag rather than `git describe`, so a tag
          # that is not on this branch's history cannot cause a re-used number.
          # `face-service-*` tags do not match v[0-9]*, so they are ignored.
          # Never empty here: v<main-version> exists (checked above).
          LAST_TAG=$(git tag --sort=-v:refname --list 'v[0-9]*' | sed -n 1p)

          NEXT=$(python - "$LAST_TAG" "$BUMP" <<'PY'
          import sys

          tag, part = sys.argv[1], sys.argv[2]
          core = tag.lstrip("v").split("-")[0].split("+")[0]
          major, minor, patch = (int(part_) for part_ in core.split(".")[:3])
          if part == "major":
              major, minor, patch = major + 1, 0, 0
          elif part == "minor":
              minor, patch = minor + 1, 0
          elif part != "patch":
              sys.exit(f"unknown bump '{part}'")
          else:
              patch += 1
          print(f"{major}.{minor}.{patch}")
          PY
          )
          if [ -z "${NEXT:-}" ]; then
            echo "::error::Could not compute the next version from '${LAST_TAG}'."
            exit 1
          fi
          if tag_exists "v${NEXT}"; then
            echo "::error::v${NEXT} already exists (computed from ${LAST_TAG})."
            exit 1
          fi

          echo "Highest tag ${LAST_TAG}; the ${BUMP} bump is ${NEXT}."
          emit release-pr "$NEXT"

      - name: Open the release pull request
        if: steps.plan.outputs.mode == 'release-pr'
        id: release_pr
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          BRANCH="release/v${VERSION}"

          # Re-dispatching is harmless: the pending release is reported, and its
          # content does not go stale (the release notes are generated from the
          # PRs merged before the release, not from this branch).
          #
          # A pull request only counts as OURS when its head branch lives in this
          # repository (not a fork), it targets main and the branch is
          # `release/v*`. `gh pr list --head` matches the branch name alone, and
          # a plain `headRefName` match matches a fork's too — either would let a
          # contributor PR be reused here, or closed and its branch deleted
          # below. Authorship is deliberately not checked: the documented
          # fallback is a pull request a human opens by hand from the same
          # branch, and a branch in this repository already requires push access.
          #
          # The same-version lookup goes through the REST API because its `head`
          # filter is owner-qualified and exact (no listing page limit can hide
          # the PR); the extra `head.repo` check rejects a fork that lives under
          # the same owner name.
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            | jq -r --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.base.ref == "main" and .head.repo.full_name == $repo)] | .[0].html_url // ""')
          if [ -n "$EXISTING" ]; then
            echo "pr-url=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "A release pull request for v${VERSION} is already open: ${EXISTING}"
            exit 0
          fi

          # Dispatching a different bump while another release pull request is
          # open (patch first, then minor) would leave two PRs that both edit the
          # same line and cannot both be merged. The newer request wins; only our
          # own release branches are touched (same-repository head, targeting
          # main), so a contributor's `release/v*` pull request is never closed.
          gh pr list --state open --limit 200 --json number,headRefName,baseRefName,isCrossRepository \
            | jq -r --arg branch "$BRANCH" '.[] | select(.isCrossRepository == false and .baseRefName == "main" and (.headRefName | startswith("release/v")) and .headRefName != $branch) | .number' \
            | while read -r NUMBER; do
                [ -n "$NUMBER" ] || continue
                echo "Closing release pull request #${NUMBER}: superseded by v${VERSION}."
                gh pr close "$NUMBER" --delete-branch --comment "Superseded by the release pull request for v${VERSION}."
              done

          python - "$VERSION" <<'PY'
          import re
          import sys
          import tomllib

          version = sys.argv[1]
          with open("pyproject.toml", encoding="utf-8") as handle:
              text = handle.read()
          updated, count = re.subn(r'(?m)^version = "[^"]*"$', f'version = "{version}"', text, count=1)
          if count != 1:
              sys.exit("could not find the [project] version line in pyproject.toml")
          with open("pyproject.toml", "w", encoding="utf-8") as handle:
              handle.write(updated)
          print("pyproject.toml now says", tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A leftover branch without an open pull request would reject the push.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH"
          fi
          git checkout -b "$BRANCH"
          git add pyproject.toml
          git commit -m "chore: release v${VERSION}"
          git push origin "$BRANCH"

          # Creating the pull request needs the repository setting "Allow GitHub
          # Actions to create and approve pull requests". When it is off, the
          # branch is already pushed, so point at the page that opens the PR.
          if PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: release v${VERSION}" \
            --body "Bumps the version in pyproject.toml to v${VERSION}.

          Merging this pull request is the release: the Release workflow then creates the tag
          v${VERSION}, publishes the GitHub release with generated notes and dispatches
          deploy.yml, which deploys both Toolforge tools.

          Pull requests opened with the built-in GITHUB_TOKEN start no CI run, so this one shows
          no checks. The release itself waits for the CI run of the merge commit on main and
          refuses to publish when that run is not green." 2>/tmp/pr-create.err); then
            echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
            echo "Opened ${PR_URL}"
          else
            cat /tmp/pr-create.err
            URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Branch ${BRANCH} is pushed but the pull request could not be created (enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'). Open it here: ${URL}"
            echo "pr-url=${URL}" >> "$GITHUB_OUTPUT"
            echo "pr-manual=true" >> "$GITHUB_OUTPUT"
          fi

      # A release deploys to production, so it must not start from a red main.
      # The run is looked up by commit; when CI has not registered one yet (a
      # repository without the workflow, or a very slow queue) the release
      # continues with a warning rather than blocking for ever.
      #
      # ci.yml cancels its own in-progress run when another commit lands on the
      # same ref. A cancelled run on a commit that is no longer the tip of main
      # is not a failure: the newer push starts its own Release run, which sees
      # the same untagged version and releases the newer commit instead.
      - name: Wait for the CI run of this commit
        if: steps.plan.outputs.mode == 'release'
        id: ci
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          RUN_ID=""
          for _ in $(seq 1 12); do
            RUN_ID=$(gh run list --workflow=ci.yml --event push --commit="$SHA" --limit=1 --json databaseId --jq '.[0].databaseId // ""')
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No ci.yml run found for ${SHA}; releasing without waiting for CI."
            echo "state=unchecked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Watching CI run ${RUN_ID} for ${SHA}"
          for _ in $(seq 1 90); do # 90 x 20 s = 30 min
            STATUS=$(gh run view "$RUN_ID" --json status --jq .status)
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed; releasing."
                echo "state=passed" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              TIP=$(git ls-remote origin refs/heads/main | cut -f1)
              if [ "$CONCLUSION" = "cancelled" ] && [ -n "$TIP" ] && [ "$TIP" != "$SHA" ]; then
                echo "::notice::CI on ${SHA} was cancelled by a newer push (${TIP}); that push's Release run will release it."
                echo "state=superseded" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::CI on ${SHA} finished as '${CONCLUSION}'; not releasing."
              exit 1
            fi
            sleep 20
          done
          echo "::error::CI on ${SHA} did not finish within 30 minutes; not releasing."
          exit 1

      - name: Create the tag and publish the release
        if: steps.plan.outputs.mode == 'release' && steps.ci.outputs.state != 'superseded'
        id: publish
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
          echo "Published $(gh release view "$TAG" --json url --jq .url)"

      # Once the release is published a re-run sees the tag and does nothing, so
      # a failed dispatch would leave a release that was never deployed. Retry,
      # and when it still fails say exactly how to deploy by hand.
      - name: Start the deploy
        if: steps.plan.outputs.mode == 'release' && steps.ci.outputs.state != 'superseded'
        id: deploy
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          for ATTEMPT in 1 2 3; do
            if gh workflow run deploy.yml --ref main -f tag="$TAG" -f db-reset=false; then
              echo "Dispatched deploy.yml for ${TAG}"
              echo "https://github.com/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml"
              exit 0
            fi
            echo "Dispatch attempt ${ATTEMPT} failed."
            sleep 10
          done
          echo "::error::${TAG} is published but its deploy was NOT started. Run it by hand: Actions > Deploy > Run workflow, tag=${TAG}."
          exit 1

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ steps.plan.outputs.mode || 'unknown' }}
          CI_STATE: ${{ steps.ci.outputs.state || '' }}
          VERSION: ${{ steps.plan.outputs.version || steps.version.outputs.main-version }}
          PR_URL: ${{ steps.release_pr.outputs.pr-url || '' }}
          PR_MANUAL: ${{ steps.release_pr.outputs.pr-manual || '' }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome || 'not run' }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome || 'not run' }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) RESULT="✅ success" ;;
            failure) RESULT="❌ failed" ;;
            cancelled) RESULT="⚠️ cancelled" ;;
            *) RESULT="❔ ${JOB_STATUS:-unknown}" ;;
          esac
          case "$MODE" in
            release)
              # The summary must not claim more than happened: this workflow
              # publishes the release and DISPATCHES the deploy (a separate run
              # that can still fail), and a failed run may have stopped before
              # the tag existed or before the deploy was started.
              if [ "$CI_STATE" = "superseded" ]; then
                ACTION="skipped — a newer push on main will release it"
              elif [ "$PUBLISH_OUTCOME" != "success" ]; then
                ACTION="NOT released — the run stopped before the tag and release were created"
              elif [ "$DEPLOY_OUTCOME" = "success" ]; then
                ACTION="tagged and published — deployment dispatched (watch the Deploy run)"
              elif [ "$DEPLOY_OUTCOME" = "cancelled" ]; then
                ACTION="tagged and published — the deploy dispatch was interrupted, check Actions > Deploy"
              else
                ACTION="tagged and published — the deploy was NOT started, run Actions > Deploy with tag=v${VERSION}"
              fi
              ;;
            release-pr)
              if [ -n "$PR_MANUAL" ]; then
                ACTION="branch pushed — open the pull request from the link below"
              else
                ACTION="release pull request ready for review"
              fi
              ;;
            none) ACTION="nothing to do — this version is already released" ;;
            *) ACTION="no plan was made (the run failed early)" ;;
          esac

          {
            echo "## 📦 Release Summary"
            echo
            echo "**Result: ${RESULT}**"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | \`${VERSION:-unknown}\` |"
            echo "| **Outcome** | ${ACTION} |"
            if [ "$MODE" = "release" ] && [ "$CI_STATE" != "superseded" ]; then
              echo "| **Tag and release** | ${PUBLISH_OUTCOME} |"
              echo "| **Deploy dispatched** | ${DEPLOY_OUTCOME} |"
            fi
            if [ -n "$PR_URL" ]; then echo "| **Pull request** | ${PR_URL} |"; fi
            echo "| **Commit** | \`${GITHUB_SHA}\` |"
            echo "| **Triggered by** | \`${{ github.actor }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
